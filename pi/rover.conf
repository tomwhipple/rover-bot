# Settings for the rover tool, installed as /etc/rover.conf.
# key = value, whole numbers. A key left out keeps the tool's default.

# The camera hangs upside down on this rover. 0 or 180.
snap_rotation = 180

snap_width = 1296
snap_height = 972

# Time the camera runs before the still, for exposure to settle.
snap_warmup_ms = 500
