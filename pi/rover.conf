# Settings for the rover's Pi programs (rover, rovercam), installed as /etc/rover.conf.
# key = value, whole numbers. A key left out keeps the program's default.

# The camera hangs upside down on this rover. 0 or 180.
camera_rotation = 180

# rover snap, when rovercam is not running
snap_width = 1296
snap_height = 972
# Time the camera runs before the still, for exposure to settle.
snap_warmup_ms = 500

# rovercam: the live stream the console shows, and rover snap while it runs
stream_width = 648
stream_height = 486
stream_fps = 15
stream_port = 8080
