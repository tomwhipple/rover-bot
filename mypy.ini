# Type check for the Python in the repo: `make mypy` (part of `make check`, the pre-push hook).
[mypy]
python_version = 3.11
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# Third-party packages without type stubs, and the protobuf module that mk/roverd.mk generates
# into build/ (it does not exist until roverd-test has run).
[mypy-mujoco.*]
ignore_missing_imports = True
[mypy-zenoh.*]
ignore_missing_imports = True
[mypy-cv2.*]
ignore_missing_imports = True
[mypy-robo_v1_pb2]
ignore_missing_imports = True
